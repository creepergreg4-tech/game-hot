name: Update Game Hot
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: game-hot-pages
  cancel-in-progress: false
jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect current official sources
        # Public source data only; browser notes and credentials never enter the artifact.
        run: node scripts/collect.mjs
      - name: Verify intelligence rules
        run: node --test tests/*.test.mjs
      - name: Persist successful snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if ! git diff --cached --quiet; then
            git commit -m "Update game intelligence snapshot"
            git push
          fi
      - run: node scripts/build.mjs
      - run: node --check public/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
